# Identical to rabbitmq-tls.conf except for two things: it serves the
# certificate issued to wrong.example.invalid, and every listener sits on
# a different port so both brokers can run at once.
#
# It exists for one assertion - that a certificate which chains to a
# trusted CA but names a different host is refused. Four of this app's six
# TLS protocols used to accept it, so the CA-only case is not enough
# coverage on its own.
#
listeners.ssl.1 = 5681
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile   = /certs/wrong.crt
ssl_options.keyfile    = /certs/wrong.key
ssl_options.versions.1 = tlsv1.2

management.ssl.port       = 26671
management.ssl.cacertfile = /certs/ca.crt
management.ssl.certfile   = /certs/wrong.crt
management.ssl.keyfile    = /certs/wrong.key

mqtt.listeners.ssl.default  = 18883
stomp.listeners.ssl.default = 51614

web_mqtt.ssl.port       = 25676
web_mqtt.ssl.cacertfile = /certs/ca.crt
web_mqtt.ssl.certfile   = /certs/wrong.crt
web_mqtt.ssl.keyfile    = /certs/wrong.key

web_stomp.ssl.port       = 25679
web_stomp.ssl.cacertfile = /certs/ca.crt
web_stomp.ssl.certfile   = /certs/wrong.crt
web_stomp.ssl.keyfile    = /certs/wrong.key

loopback_users = none
default_user  = app-user
default_pass  = app-pass
default_vhost = demo-vhost
