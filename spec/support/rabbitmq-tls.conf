# TLS listeners for every protocol this app speaks, mounted into the
# rabbitmq-tls service in docker-compose.test.yml.
#
# The plaintext listeners are deliberately left at their defaults inside
# this container - only the TLS ports are published to the host, so a
# derived TLS endpoint (mqtts 8883, stomps 61614, web_mqtt_tls 15676)
# reaches this broker while its plaintext twin reaches the other one.
#
# web_stomp's TLS port is 15679 rather than the 15673 RabbitMQ's own
# documentation uses, because rabbitmq-no-chx already publishes 15673.
# The app has no default port for web_stomp_tls anyway (RabbitMQ
# documents none), so it has to be advertised in the binding regardless -
# which makes this a free choice rather than a workaround.
#
# mqtt and stomp inherit ssl_options; the two WebSocket plugins do not,
# so they are given the same files explicitly. That asymmetry is the
# reason rabbitmq-forge-boshrelease renders no TLS listener for any of
# the four - see the note in README.md.
listeners.ssl.1 = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile   = /certs/server.crt
ssl_options.keyfile    = /certs/server.key
ssl_options.versions.1 = tlsv1.2

management.ssl.port       = 15671
management.ssl.cacertfile = /certs/ca.crt
management.ssl.certfile   = /certs/server.crt
management.ssl.keyfile    = /certs/server.key

mqtt.listeners.ssl.default  = 8883
stomp.listeners.ssl.default = 61614

web_mqtt.ssl.port       = 15676
web_mqtt.ssl.cacertfile = /certs/ca.crt
web_mqtt.ssl.certfile   = /certs/server.crt
web_mqtt.ssl.keyfile    = /certs/server.key

web_stomp.ssl.port       = 15679
web_stomp.ssl.cacertfile = /certs/ca.crt
web_stomp.ssl.certfile   = /certs/server.crt
web_stomp.ssl.keyfile    = /certs/server.key

loopback_users = none
default_user  = app-user
default_pass  = app-pass
default_vhost = demo-vhost
