# Broker(s) for `spec/integration`. Ruby runs natively via rbenv (Ruby
# 3.3.11) - there is no app service here.
#
# Image: rabbitmq:3.13-management
#   digest sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
#   Last confirmed reporting itself as RabbitMQ 3.13.7, Erlang 26.2.5.6.
#   If a run fails here, check whether the tag has moved to a newer patch
#   before suspecting the app.
services:
  # Full listener set: amqp, management, mqtt, stomp, web-mqtt, web-stomp,
  # and the consistent-hash exchange type.
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"
      - "61613:61613"
      - "15674:15674"
      - "15675:15675"
    environment:
      RABBITMQ_DEFAULT_USER: app-user
      RABBITMQ_DEFAULT_PASS: app-pass
      RABBITMQ_DEFAULT_VHOST: demo-vhost
    command: >
      bash -c "rabbitmq-plugins enable --offline
      rabbitmq_management rabbitmq_mqtt rabbitmq_stomp
      rabbitmq_web_mqtt rabbitmq_web_stomp
      rabbitmq_consistent_hash_exchange &&
      rabbitmq-server"
    # check_port_connectivity, not ping: ping only proves the node process is
    # up and registered with EPMD, which it is several seconds before any
    # listener accepts a connection. `up --wait` gating on ping let the suite
    # start against brokers that then reset every connection.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Deliberately missing rabbitmq_consistent_hash_exchange (management
  # ships enabled by the base image; nothing else is turned on). Exists
  # solely so spec/integration/exchange_type_spec.rb can observe what
  # Bunny actually raises for an unknown exchange type against a real
  # broker (amendment 2) without disabling the plugin on the primary
  # broker the rest of the suite depends on.
  rabbitmq-no-chx:
    image: rabbitmq:3.13-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app-user
      RABBITMQ_DEFAULT_PASS: app-pass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # TLS for every protocol, on the standard TLS ports (5671, 15671, 8883,
  # 61614, 15676) plus 15679 for web-stomp. A separate broker rather than
  # TLS on the one above, because the app derives a TLS endpoint on the
  # protocol's *standard* port against the binding's host - so with both
  # published on localhost, every derived TLS endpoint lands here and
  # every plaintext one lands on rabbitmq, with no fixture gymnastics.
  #
  # Image: rabbitmq:4.2-management. Deliberately a different line from the
  # 3.13 broker above: 4.2 is what the Blacksmith rabbitmq forge deploys
  # (verified at 4.2.8), and TLS listener configuration is exactly where
  # the two lines could diverge.
  #
  # Certificates come from spec/support/gen-tls-certs.sh - run it first.
  rabbitmq-tls:
    image: rabbitmq:4.2-management
    ports:
      - "5671:5671"
      - "15671:15671"
      - "8883:8883"
      - "61614:61614"
      - "15676:15676"
      - "15679:15679"
    volumes:
      - ./spec/support/tls:/certs:ro
      - ./spec/support/rabbitmq-tls.conf:/etc/rabbitmq/rabbitmq.conf:ro
    command: >
      bash -c "rabbitmq-plugins enable --offline
      rabbitmq_management rabbitmq_mqtt rabbitmq_stomp
      rabbitmq_web_mqtt rabbitmq_web_stomp &&
      rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Same certificate authority as rabbitmq-tls, but the certificate names
  # wrong.example.invalid. Exists so spec/integration/tls_spec.rb can tell
  # "verifies the chain" apart from "verifies who it is talking to" - four
  # of the six TLS protocols passed the first and failed the second.
  rabbitmq-wrong-host:
    image: rabbitmq:4.2-management
    ports:
      - "5681:5681"
      - "26671:26671"
      - "18883:18883"
      - "51614:51614"
      - "25676:25676"
      - "25679:25679"
    volumes:
      - ./spec/support/tls:/certs:ro
      - ./spec/support/rabbitmq-wrong-host.conf:/etc/rabbitmq/rabbitmq.conf:ro
    command: >
      bash -c "rabbitmq-plugins enable --offline
      rabbitmq_management rabbitmq_mqtt rabbitmq_stomp
      rabbitmq_web_mqtt rabbitmq_web_stomp &&
      rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
